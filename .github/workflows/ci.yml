name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# Tag coverage map (see test/test_helper.exs for the default exclusions and
# test/TAGGING_STRATEGY.md for the meaning of each tag):
#
#   compliance ............ `compliance` job (all protocol versions, one run)
#   integration ........... `test` job  -> mix test.suite integration
#   requires_http ......... `test` job  -> mix test.suite integration
#   requires_stdio ........ `test` job  -> mix test.suite integration
#   requires_beam ......... `test` job  -> mix test.suite integration
#   requires_bypass ....... `test` job  -> --include requires_bypass
#   slow / performance / stress
#                         `extended` job -> mix test.suite performance
#   interop ............... `interop` job (Node.js + npm)
#   live_server ........... reserved for tests requiring a live service.
#   wip / skip ............ intentionally never run; `scripts/check_skip_tags.sh`
#                           fails the build if a test is left tagged :skip.

env:
  MIX_ENV: test
  CI_OTP_VERSION: '27.0'
  CI_ELIXIR_VERSION: '1.17.3'
  ARBOR_RPC_PATH: ${{ github.workspace }}/.arbor-v2/acp/packages/arbor_rpc

jobs:
  archive_consumer:
    name: Four-package archive consumer / Elixir ${{ matrix.toolchain.elixir }} / OTP ${{ matrix.toolchain.otp }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: prod
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          # Keep the minimum pair; refresh the other pins after BEAM latest passes.
          - {elixir: '1.17.3', otp: '27.0'}
          - {elixir: '1.18.5', otp: '27.3.4.18'}
          - {elixir: '1.19.6', otp: '28.5.0.7'}
          - {elixir: '1.20.4', otp: '29.1.1'}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check out unpublished ACP packages
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: trust-arbor/arbor_acp
        ref: 0f8ff717837aba8c0b73eb117510225b40e5f98c
        path: .arbor-v2/acp
        persist-credentials: false
    - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
      with:
        otp-version: ${{ matrix.toolchain.otp }}
        elixir-version: ${{ matrix.toolchain.elixir }}
        version-type: strict
    - name: Read the coordinated source version
      run: |
        python3 -B - <<'PYVERSION'
        import os, pathlib, re
        paths = [pathlib.Path("mix.exs"), pathlib.Path(".arbor-v2/acp/packages/arbor_rpc/mix.exs"), pathlib.Path(".arbor-v2/acp/packages/arbor_acp/mix.exs"), pathlib.Path(".arbor-v2/acp/packages/arbor_acp_adapters/mix.exs")]
        versions = [re.findall(r'@version "([^"]+)"', path.read_text()) for path in paths]
        if any(len(version) != 1 for version in versions) or len({version[0] for version in versions}) != 1:
            raise SystemExit("Package source versions must match")
        version = versions[0][0]
        if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
            raise SystemExit("Invalid package version")
        with open(os.environ["GITHUB_ENV"], "a") as output:
            output.write("ARCHIVE_EXPECTED_VERSION=" + version + "\n")
        PYVERSION
    - name: Check consumer formatting
      if: matrix.toolchain.elixir == '1.17.3'
      run: mix format --check-formatted fixtures/archive_consumer/mix.exs fixtures/archive_consumer/lib/combined_archive_consumer.ex
    - name: Build publishable source archives
      run: |
        mkdir -p archive-consumer-input
        mix deps.get --only prod
        env -u ARBOR_RPC_PATH mix hex.build --output "archive-consumer-input/arbor_mcp-$ARCHIVE_EXPECTED_VERSION.tar"
        for package in arbor_rpc arbor_acp arbor_acp_adapters; do
          (
            cd ".arbor-v2/acp/packages/$package"
            ARBOR_V2_LOCAL=1 mix deps.get --only prod
            ARBOR_V2_LOCAL=0 mix hex.build --output "$GITHUB_WORKSPACE/archive-consumer-input/$package-$ARCHIVE_EXPECTED_VERSION.tar"
          )
        done
    - name: Install archives and probe a compiler-free release
      run: python3 scripts/check_archive_consumer.py archive-consumer-input --expected-version "$ARCHIVE_EXPECTED_VERSION"
    - name: Preserve qualified source archives
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: four-package-source-archives-${{ matrix.toolchain.elixir }}
        path: archive-consumer-input/*.tar

  listener_archive_consumer:
    name: HTTP archive consumer / ${{ matrix.adapter }} / Elixir ${{ matrix.toolchain.elixir }} / OTP ${{ matrix.toolchain.otp }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: prod
    strategy:
      fail-fast: false
      matrix:
        adapter: [cowboy, bandit]
        toolchain:
          # Keep the minimum pair; refresh the other pins after BEAM latest passes.
          - {elixir: '1.17.3', otp: '27.0'}
          - {elixir: '1.18.5', otp: '27.3.4.18'}
          - {elixir: '1.19.6', otp: '28.5.0.7'}
          - {elixir: '1.20.4', otp: '29.1.1'}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Check out unpublished shared RPC
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: trust-arbor/arbor_acp
        ref: 0f8ff717837aba8c0b73eb117510225b40e5f98c
        path: .arbor-v2/acp
        persist-credentials: false
    - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
      with:
        otp-version: ${{ matrix.toolchain.otp }}
        elixir-version: ${{ matrix.toolchain.elixir }}
        version-type: strict
    - name: Read the coordinated source version
      run: |
        python3 -B - <<'PYVERSION'
        import os, pathlib, re
        paths = [pathlib.Path("mix.exs"), pathlib.Path(".arbor-v2/acp/packages/arbor_rpc/mix.exs"), pathlib.Path(".arbor-v2/acp/packages/arbor_acp/mix.exs"), pathlib.Path(".arbor-v2/acp/packages/arbor_acp_adapters/mix.exs")]
        versions = [re.findall(r'@version "([^"]+)"', path.read_text()) for path in paths]
        if any(len(version) != 1 for version in versions) or len({version[0] for version in versions}) != 1:
            raise SystemExit("Package source versions must match")
        version = versions[0][0]
        if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?", version):
            raise SystemExit("Invalid package version")
        with open(os.environ["GITHUB_ENV"], "a") as output:
            output.write("ARCHIVE_EXPECTED_VERSION=" + version + "\n")
        PYVERSION
    - name: Check HTTP consumer formatting
      if: matrix.toolchain.elixir == '1.17.3'
      run: mix format --check-formatted fixtures/listener_archive_consumer/mix.exs fixtures/listener_archive_consumer/lib/listener_archive_consumer.ex
    - name: Build source archives
      run: |
        mkdir -p listener-archive-input
        mix deps.get --only prod
        env -u ARBOR_RPC_PATH mix hex.build --output "listener-archive-input/arbor_mcp-$ARCHIVE_EXPECTED_VERSION.tar"
        (
          cd .arbor-v2/acp/packages/arbor_rpc
          mix deps.get --only prod
          mix hex.build --output "$GITHUB_WORKSPACE/listener-archive-input/arbor_rpc-$ARCHIVE_EXPECTED_VERSION.tar"
        )
    - name: Match every shipped source file to its commit
      run: >
        python3 -B scripts/check_archive_source_selection.py
        --archives listener-archive-input
        --mcp-source . --acp-source .arbor-v2/acp
        --version "$ARCHIVE_EXPECTED_VERSION" --output listener-archive-input/source-selection.json
    - name: Resolve the selected HTTP backend and probe installed and compiler-free applications
      run: >
        python3 -B scripts/check_listener_archive_consumer.py
        --archives listener-archive-input
        --workspace "$RUNNER_TEMP/listener-archive-consumer"
        --expected-version "$ARCHIVE_EXPECTED_VERSION" --adapter ${{ matrix.adapter }}
        --selection-manifest listener-archive-input/source-selection.json
    - name: Preserve HTTP archive qualification receipts
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: http-archive-consumer-${{ matrix.adapter }}-${{ matrix.toolchain.elixir }}
        path: |
          listener-archive-input/*
          ${{ runner.temp }}/listener-archive-consumer/result.json
          ${{ runner.temp }}/listener-archive-consumer/logs/*
          ${{ runner.temp }}/listener-archive-consumer/installed-probe.json
          ${{ runner.temp }}/listener-archive-consumer/release-probe.json
          ${{ runner.temp }}/listener-archive-consumer/consumer/mix.lock
        if-no-files-found: error

  test:
    name: Test on OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: '27.0'
            elixir: '1.17.3'
            quality: true
          - otp: '27.3.4.18'
            elixir: '1.18.5'
            quality: false
          - otp: '28.5.0.7'
            elixir: '1.19.6'
            quality: false
          - otp: '29.1.1'
            elixir: '1.20.4'
            quality: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Temporary source checkout until the shared RPC package is published.
    - name: Check out unpublished shared RPC
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: trust-arbor/arbor_acp
        ref: 0f8ff717837aba8c0b73eb117510225b40e5f98c
        path: .arbor-v2/acp
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: ${{matrix.otp}}
        elixir-version: ${{matrix.elixir}}
        version-type: strict

    - name: Restore deps/_build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Audit locked dependencies
      if: matrix.quality
      run: mix hex.audit

    - name: Build Hex package
      if: matrix.quality
      run: env -u ARBOR_RPC_PATH mix hex.build --output /tmp/arbor_mcp-package.tar

    - name: Compile dependencies
      run: mix deps.compile

    - name: Check formatting
      if: matrix.quality
      run: mix format --check-formatted

    - name: Run credo
      if: matrix.quality
      run: mix credo --strict

    - name: Check for skipped tests
      if: matrix.quality
      run: ./scripts/check_skip_tags.sh all

    - name: Check for unused dependencies
      if: matrix.quality
      run: mix deps.unlock --check-unused

    - name: Compile without warnings
      # Dependencies are compiled in the preceding step. Avoid re-checking them
      # under warnings-as-errors: OTP 29 reports deprecations in third-party
      # Erlang sources (notably jose) that Arbor.MCP cannot fix locally.
      run: mix compile --warnings-as-errors --no-deps-check

    - name: Generate documentation without warnings
      if: matrix.quality
      run: MIX_ENV=dev mix docs

    - name: Run unit tests
      run: mix test --exclude compliance

    - name: Run integration-tagged tests
      run: mix test.suite integration --include requires_bypass

    - name: Run security check
      if: matrix.quality
      run: mix sobelow --skip

  compliance:
    name: MCP Compliance Suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Temporary source checkout until the shared RPC package is published.
    - name: Check out unpublished shared RPC
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: trust-arbor/arbor_acp
        ref: 0f8ff717837aba8c0b73eb117510225b40e5f98c
        path: .arbor-v2/acp
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: ${{ env.CI_OTP_VERSION }}
        elixir-version: ${{ env.CI_ELIXIR_VERSION }}
        version-type: strict

    - name: Restore deps/_build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile

    # One job, not a per-version matrix: the legacy compliance suite is generated
    # across every initialize-compatible revision in a single run
    # (test/arbor_mcp/compliance/version_generator.ex plus the version-specific
    # handlers in test/arbor_mcp/compliance/handlers/), and 2025-11-25 behaviour is
    # covered by the dedicated files (icons_test.exs, version_*_test.exs).
    # Modern 2026-07-28 coverage lives in the era-specific unit/integration
    # suites and scripts/conformance.sh modern.
    # Running the same suite three times under different job names only
    # duplicated work.
    - name: Run MCP compliance tests
      run: mix test.suite compliance
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  extended:
    name: Performance & stress suite
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Temporary source checkout until the shared RPC package is published.
    - name: Check out unpublished shared RPC
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: trust-arbor/arbor_acp
        ref: 0f8ff717837aba8c0b73eb117510225b40e5f98c
        path: .arbor-v2/acp
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: ${{ env.CI_OTP_VERSION }}
        elixir-version: ${{ env.CI_ELIXIR_VERSION }}
        version-type: strict

    - name: Restore deps/_build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile

    # Covers the :performance, :stress and :slow tags, which are excluded by
    # default in test/test_helper.exs and are otherwise never exercised.
    - name: Run performance and stress tests
      run: mix test.suite performance

  interop:
    name: Cross-language interop (Node.js)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Temporary source checkout until the shared RPC package is published.
    - name: Check out unpublished shared RPC
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: trust-arbor/arbor_acp
        ref: 0f8ff717837aba8c0b73eb117510225b40e5f98c
        path: .arbor-v2/acp
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: ${{ env.CI_OTP_VERSION }}
        elixir-version: ${{ env.CI_ELIXIR_VERSION }}
        version-type: strict

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: '20'

    - name: Restore deps/_build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-

    - name: Cache interop node_modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: test/interop/node_modules
        key: ${{ runner.os }}-interop-node-${{ hashFiles('test/interop/package.json', 'test/interop/package-lock.json') }}

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile

    # The interop tests install their own npm deps on first run and skip
    # themselves if `node` is unavailable. Each direction and protocol era
    # runs in its own VM so subprocess and transport state cannot leak between
    # the legacy SDK and the 2026-07-28 SDK.
    - name: Run legacy TypeScript client to Arbor.MCP server tests
      run: mix test --only interop_ts_client

    - name: Run legacy Arbor.MCP client to TypeScript server tests
      run: mix test --only interop_ex_mcp_client

    - name: Run modern TypeScript stdio client to Arbor.MCP server tests
      run: mix test --only interop_modern_ts_client

    - name: Run modern Arbor.MCP stdio client to TypeScript server tests
      run: mix test --only interop_modern_ex_mcp_client

    - name: Run modern TypeScript HTTP client to Arbor.MCP server tests
      run: mix test --only interop_modern_ts_http_client

    - name: Run modern Arbor.MCP HTTP client to TypeScript server tests
      run: mix test --only interop_modern_ex_mcp_http_client

  external-conformance:
    name: MCP 2026-07-28 external conformance
    runs-on: ubuntu-latest
    # The harness launches client scenarios in parallel. Keep test-only
    # dependencies (notably PropCheck's shared CounterStrike DETS file) out of
    # those independent VMs so they cannot race over global test state.
    env:
      MIX_ENV: dev

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Temporary source checkout until the shared RPC package is published.
    - name: Check out unpublished shared RPC
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: trust-arbor/arbor_acp
        ref: 0f8ff717837aba8c0b73eb117510225b40e5f98c
        path: .arbor-v2/acp
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: ${{ env.CI_OTP_VERSION }}
        elixir-version: ${{ env.CI_ELIXIR_VERSION }}
        version-type: strict

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        # The 2026-07-28 alpha harness imports fs.globSync (Node 22+).
        node-version: '22'

    - name: Restore deps/_build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile

    - name: Run complete modern conformance suites
      run: ./scripts/conformance.sh modern

    - name: Preserve conformance evidence
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
      with:
        name: mcp-2026-07-28-conformance
        path: |
          tmp/conformance_output.txt
          tmp/conformance_server.log
        if-no-files-found: error

  coverage:
    name: Coverage (full suite)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Temporary source checkout until the shared RPC package is published.
    - name: Check out unpublished shared RPC
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: trust-arbor/arbor_acp
        ref: 0f8ff717837aba8c0b73eb117510225b40e5f98c
        path: .arbor-v2/acp
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: ${{ env.CI_OTP_VERSION }}
        elixir-version: ${{ env.CI_ELIXIR_VERSION }}
        version-type: strict

    - name: Restore deps/_build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile

    # Everything except the tags that need external services or Node.js
    # (those run in the `extended` / `interop` jobs).
    - name: Run tests with coverage
      run: >
        mix coveralls.github
        --include compliance
        --include integration
        --include requires_http
        --include requires_stdio
        --include requires_beam
        --include requires_bypass
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false

    # Temporary source checkout until the shared RPC package is published.
    - name: Check out unpublished shared RPC
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: trust-arbor/arbor_acp
        ref: 0f8ff717837aba8c0b73eb117510225b40e5f98c
        path: .arbor-v2/acp
        persist-credentials: false

    - name: Set up Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
      with:
        otp-version: ${{ env.CI_OTP_VERSION }}
        elixir-version: ${{ env.CI_ELIXIR_VERSION }}
        version-type: strict

    - name: Restore deps/_build cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-

    - name: Restore PLT cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: plt_cache
      with:
        path: priv/plts
        key: ${{ runner.os }}-plt-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-plt-${{ env.CI_OTP_VERSION }}-${{ env.CI_ELIXIR_VERSION }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Create PLTs
      if: steps.plt_cache.outputs.cache-hit != 'true'
      run: mix dialyzer --plt

    - name: Run dialyzer
      run: mix dialyzer --format github
